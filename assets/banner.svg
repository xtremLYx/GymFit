<svg xmlns="http://www.w3.org/2000/svg" width="660" height="190" viewBox="0 0 660 190" role="img" aria-label="GymFit — Self-hosted gym &amp; body-weight tracker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140f11"/>
      <stop offset="100%" stop-color="#0d0c0e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="660" height="190" rx="22" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="657" height="187" rx="20.5" fill="none" stroke="#381c22" stroke-width="2.5"/>

  <!-- Ambient red accent glow behind dumbbell -->
  <circle cx="122" cy="95" r="42" fill="#ef4444" opacity="0.15" filter="url(#glow)"/>

  <!-- dumbbell mark -->
  <g transform="translate(122,96) scale(0.82)" fill="#ef4444">
    <rect x="-72" y="-10" width="144" height="20" rx="7"/>
    <rect x="-80" y="-36" width="20" height="72" rx="7"/>
    <rect x="-104" y="-25" width="17" height="50" rx="7"/>
    <rect x="60"  y="-36" width="20" height="72" rx="7"/>
    <rect x="87"  y="-25" width="17" height="50" rx="7"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="224" y="86" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="-2">
    <tspan fill="#ffffff">Gym</tspan><tspan fill="#ef4444">Fit</tspan>
  </text>
  <text x="226" y="120" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20.5" font-weight="600" fill="#9ca3af">Self-hosted gym &amp; body-weight tracker</text>
  <text x="226" y="146" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#6b7280">passkey login  ·  pure privacy  ·  custom routines  ·  AGPL</text>
</svg>
